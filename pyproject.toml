[project]
name = "memovo-ai"
version = "0.1.0"
description = "Memovo AI Service - memory processing and retrieval (Sprint 1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
# The model runtime. Kept optional so `uv sync` and CI stay light: unit tests
# inject a fake encoder and never import this. Install for production, or to
# run the embedding integration test:
#     uv sync --extra embeddings
embeddings = [
    "sentence-transformers>=3.0.0",
]
# The MongoDB driver. Optional for the same reason: unit tests substitute a
# stub collection, so CI needs neither the driver nor a cluster.
#     uv sync --extra atlas
atlas = [
    "pymongo>=4.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Required by starlette's TestClient, which drives the route tests.
    "httpx2>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memovo_ai"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error",
    # starlette's TestClient still uses the deprecated anyio alias. Third
    # party, nothing to fix here; drop this once starlette updates.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "unit: isolated component tests",
    "integration: cross-component tests through the application layer",
    "contract: public API request/response shape tests",
    "evaluation: retrieval quality evaluation tests",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "A",    # flake8-builtins
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # assert is the point of a test
    "ANN201", # test functions need no return annotation
    # Multilingual fixtures deliberately contain non-ASCII text; RUF001's
    # suggested ASCII substitutions would defeat what those tests prove.
    "RUF001",
    "RUF003",
]
# The sentence splitter exists to match non-ASCII punctuation (Arabic and CJK
# terminators). RUF001/RUF003 flag exactly the characters the module is for,
# and its suggested ASCII replacements are wrong here.
"src/memovo_ai/chunking/hybrid_chunker.py" = ["RUF001", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["memovo_ai"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "src"
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional extras; absent from the default dev install.
module = ["sentence_transformers.*", "pymongo.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
